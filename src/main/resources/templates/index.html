<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title != null ? title : 'PayPal Payment Integration'}">PayPal Integration</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

<div class="bg-white rounded-2xl shadow-xl border border-slate-100 w-full max-w-md p-8 text-center transition-all duration-300 hover:shadow-2xl">
    <!-- PayPal Icon Badge -->
    <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-50 text-blue-600 rounded-2xl mb-5 shadow-inner">
        <svg class="w-8 h-8" fill="currentColor" viewBox="0 0 24 24">
            <path d="M7.076 21.337H2.47a.641.641 0 0 1-.633-.74L4.944.901C5.026.382 5.474 0 5.998 0h7.46c2.57 0 4.578.543 5.69 1.81 1.01 1.15 1.304 2.42 1.012 4.287-.023.143-.047.288-.077.437-.983 5.05-4.349 6.797-8.647 6.797h-2.19c-.524 0-.968.382-1.05.9l-1.12 7.106z"/>
        </svg>
    </div>

    <h1 class="text-2xl font-bold text-slate-800 tracking-tight">PayPal Checkout</h1>
    <p class="text-slate-500 text-sm mt-1 mb-6">Secure payment gateway integration</p>

    <!-- Form -->
    <form method="post" action="/payment/create" class="space-y-4 text-left">
        <div>
            <label for="method" class="block text-xs font-semibold text-slate-600 uppercase mb-1">Payment Method</label>
            <input id="method" name="method" type="text" value="paypal" readonly
                   class="w-full px-4 py-2 bg-slate-100 border border-slate-200 rounded-xl text-slate-600 text-sm focus:outline-none">
        </div>

        <div>
            <label for="amount" class="block text-xs font-semibold text-slate-600 uppercase mb-1">Amount ($)</label>
            <input id="amount" name="amount" type="number" step="0.01" value="10.00" required
                   class="w-full px-4 py-2 bg-white border border-slate-200 rounded-xl text-slate-800 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>

        <div>
            <label for="currency" class="block text-xs font-semibold text-slate-600 uppercase mb-1">Currency</label>
            <select id="currency" name="currency"
                    class="w-full px-4 py-2 bg-white border border-slate-200 rounded-xl text-slate-800 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                <option value="USD" selected>USD</option>
                <option value="EUR">EUR</option>
            </select>
        </div>

        <div>
            <label for="description" class="block text-xs font-semibold text-slate-600 uppercase mb-1">Description</label>
            <input id="description" name="description" type="text" value="Payment for order #001" required
                   class="w-full px-4 py-2 bg-white border border-slate-200 rounded-xl text-slate-800 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>

        <button type="submit" class="w-full mt-2 bg-blue-600 hover:bg-blue-700 active:scale-[0.98] text-white font-semibold py-3.5 px-6 rounded-xl shadow-lg shadow-blue-500/25 transition-all duration-200 flex items-center justify-center gap-2">
            <span>Pay with PayPal</span>
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
            </svg>
        </button>
    </form>
</div>

</body>
</html>
