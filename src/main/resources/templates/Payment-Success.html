<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title != null ? title : 'Payment Success'}">Payment Success</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

<div class="bg-white rounded-2xl shadow-xl border border-slate-100 w-full max-w-md p-8 text-center">
    <!-- Success Icon -->
    <div class="inline-flex items-center justify-center w-20 h-20 bg-emerald-50 text-emerald-500 rounded-full mb-5 shadow-sm">
        <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/>
        </svg>
    </div>

    <h1 class="text-2xl font-bold text-slate-800 tracking-tight">Payment Successful!</h1>
    <p class="text-slate-500 text-sm mt-2 mb-8">Thank you for your transaction. Your payment has been processed successfully.</p>

    <a th:href="@{/}" class="inline-flex items-center justify-center w-full bg-slate-900 hover:bg-slate-800 active:scale-[0.98] text-white font-semibold py-3.5 px-6 rounded-xl shadow-md transition-all duration-200">
        Back to Home
    </a>
</div>

</body>
</html>
